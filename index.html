<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almanca ⇄ Türkçe Kartlar</title>
<style>
  :root{
    --bg: #14171f;
    --panel: #1c2029;
    --panel-2: #232838;
    --gold: #d9a544;
    --red: #b8453d;
    --text: #f2eee4;
    --muted: #9aa0b3;
    --good: #6fae7f;
    --bad: #c15c53;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(217,165,68,0.10), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(184,69,61,0.12), transparent 50%),
      var(--bg);
    color:var(--text);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .app{ width:100%; max-width:480px; }
  .eyebrow{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--gold);
    margin-bottom:4px;
  }
  h1{
    font-size:28px;
    margin:0 0 4px;
    font-weight:600;
  }
  .sub{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color:var(--muted);
    font-size:13.5px;
    margin-bottom:18px;
  }

  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .tab{
    flex:1;
    padding:10px 0;
    text-align:center;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background:var(--panel);
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .tab.active{
    background:var(--gold);
    color:#1c1610;
    border-color:var(--gold);
    font-weight:700;
  }

  .chips{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:18px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .chip{
    padding:5px 11px;
    border-radius:999px;
    font-size:11.5px;
    background:var(--panel);
    color:var(--muted);
    border:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
  }
  .chip.active{
    background:rgba(217,165,68,0.16);
    color:var(--gold);
    border-color:rgba(217,165,68,0.5);
  }

  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:12px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .bar{
    height:3px;
    background:rgba(255,255,255,0.08);
    border-radius:2px;
    margin-bottom:20px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--red));
    transition: width .25s ease;
  }

  /* Flashcard */
  .stage{ perspective:1400px; margin-bottom:18px; }
  .card{
    position:relative;
    height:230px;
    border-radius:20px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped{ transform: rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    border-radius:20px;
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:24px;
    text-align:center;
  }
  .face-front{
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid rgba(217,165,68,0.25);
  }
  .face-back{
    background: linear-gradient(160deg, #2a1a19, #1c2029);
    border:1px solid rgba(184,69,61,0.35);
    transform: rotateY(180deg);
  }
  .tag{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
  }
  .face-back .tag{ color:var(--red); }
  .word{ font-size:30px; font-weight:600; line-height:1.2; }
  .pos{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
  }
  .example{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:12.5px;
    color:var(--muted);
    margin-top:12px;
    font-style:italic;
  }
  .hint{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:11px;
    color:var(--muted);
    text-align:center;
    margin-bottom:16px;
  }

  .controls{ display:flex; gap:8px; }
  button.ctrl{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    flex:1;
    padding:12px 0;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.1);
    background:var(--panel);
    color:var(--text);
    font-size:13.5px;
    cursor:pointer;
  }
  button.ctrl.primary{
    background:var(--red);
    border-color:var(--red);
    font-weight:700;
  }

  /* Quiz mode */
  .quiz-card{
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border:1px solid rgba(217,165,68,0.2);
    border-radius:20px;
    padding:28px 22px;
    text-align:center;
    margin-bottom:18px;
  }
  .quiz-word{ font-size:30px; font-weight:600; margin-bottom:6px; }
  .quiz-sub{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:12px; color:var(--muted);
  }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding:13px 16px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.1);
    background:var(--panel);
    color:var(--text);
    font-size:14.5px;
    text-align:left;
    cursor:pointer;
  }
  .opt.correct{ background:rgba(111,174,127,0.18); border-color:var(--good); color:var(--good); }
  .opt.wrong{ background:rgba(193,92,83,0.18); border-color:var(--bad); color:var(--bad); }
  .opt[disabled]{ cursor:default; }

  .score-pill{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:inline-block;
    font-size:12px;
    color:var(--gold);
    background:rgba(217,165,68,0.12);
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:14px;
  }

  .done{
    text-align:center;
    padding:40px 20px;
  }
  .done .word{ font-size:36px; margin-bottom:6px; }
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow">Kelime Kartları</div>
  <h1>Almanca ⇄ Türkçe</h1>
  <div class="sub">A1 seviyesi tüm temel kelimeler · 21 kategori</div>

  <div class="tabs">
    <div class="tab active" id="tabCards">Kartlar</div>
    <div class="tab" id="tabQuiz">Quiz</div>
  </div>

  <div class="chips" id="chips"></div>

  <!-- CARDS VIEW -->
  <div id="cardsView">
    <div class="progress-row">
      <span id="cardCount">1 / 40</span>
      <span id="cardCat">Tümü</span>
    </div>
    <div class="bar"><div class="bar-fill" id="cardBar" style="width:2.5%"></div></div>

    <div class="stage">
      <div class="card" id="card">
        <div class="face face-front">
          <div class="tag">Deutsch</div>
          <div class="word" id="deWord">Hallo</div>
          <div class="pos" id="dePos">ünlem</div>
        </div>
        <div class="face face-back">
          <div class="tag">Türkçe</div>
          <div class="word" id="trWord">Merhaba</div>
          <div class="example" id="trExample">Hallo, wie geht's?</div>
        </div>
      </div>
    </div>
    <div class="hint">Çevirmek için karta dokun</div>

    <div class="controls">
      <button class="ctrl" id="prevBtn">Önceki</button>
      <button class="ctrl" id="shuffleBtn">Karıştır</button>
      <button class="ctrl primary" id="nextBtn">Sonraki</button>
    </div>
  </div>

  <!-- QUIZ VIEW -->
  <div id="quizView" style="display:none;">
    <div class="progress-row">
      <span id="quizCount">Soru 1 / 40</span>
      <span class="score-pill" id="scorePill">0 doğru</span>
    </div>
    <div class="bar"><div class="bar-fill" id="quizBar" style="width:2.5%"></div></div>

    <div class="quiz-card">
      <div class="tag" style="color:var(--gold)">Bu kelimenin anlamı nedir?</div>
      <div class="quiz-word" id="quizWord">Hallo</div>
      <div class="quiz-sub" id="quizPos">ünlem</div>
    </div>

    <div class="options" id="options"></div>
  </div>

  <div id="doneView" class="done" style="display:none;">
    <div class="word">Bitti! 🎉</div>
    <div class="sub" id="finalScore" style="margin-top:6px;"></div>
    <div class="controls" style="margin-top:20px;">
      <button class="ctrl primary" id="restartBtn">Tekrar Başla</button>
    </div>
  </div>
</div>

const categories = ["Tümü", ...Array.from(new Set(vocab.map(v => v.cat)))];
let activeCat = "Tümü";
let deck = [...vocab];
let idx = 0;
let flipped = false;

// quiz state
let quizDeck = [];
let qIdx = 0;
let score = 0;
let answered = false;

const chipsEl = document.getElementById('chips');
categories.forEach(cat => {
  const c = document.createElement('div');
  c.className = 'chip' + (cat === activeCat ? ' active' : '');
  c.textContent = cat;
  c.onclick = () => { activeCat = cat; applyFilter(); };
  chipsEl.appendChild(c);
});

function applyFilter(){
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === activeCat));
  deck = activeCat === "Tümü" ? [...vocab] : vocab.filter(v => v.cat === activeCat);
  idx = 0; flipped = false;
  renderCard();
  buildQuizDeck();
  renderQuiz();
}

function renderCard(){
  const v = deck[idx];
  document.getElementById('deWord').textContent = v.de;
  document.getElementById('dePos').textContent = v.pos;
  document.getElementById('trWord').textContent = v.tr;
  document.getElementById('trExample').textContent = v.ex;
  document.getElementById('cardCount').textContent = `${idx+1} / ${deck.length}`;
  document.getElementById('cardCat').textContent = activeCat;
  document.getElementById('cardBar').style.width = `${((idx+1)/deck.length)*100}%`;
  const cardEl = document.getElementById('card');
  cardEl.classList.remove('flipped');
  flipped = false;
}

document.getElementById('card').onclick = () => {
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
};
document.getElementById('nextBtn').onclick = () => { idx = (idx+1) % deck.length; renderCard(); };
document.getElementById('prevBtn').onclick = () => { idx = (idx-1+deck.length) % deck.length; renderCard(); };
document.getElementById('shuffleBtn').onclick = () => {
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  idx = 0; renderCard();
};

// ---- Quiz ----
function buildQuizDeck(){
  quizDeck = [...deck];
  for(let i=quizDeck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [quizDeck[i],quizDeck[j]]=[quizDeck[j],quizDeck[i]]; }
  qIdx = 0; score = 0; answered = false;
  document.getElementById('doneView').style.display = 'none';
  document.getElementById('quizView').style.display = document.getElementById('tabQuiz').classList.contains('active') ? 'block' : 'none';
}

function renderQuiz(){
  if(quizDeck.length === 0) return;
  if(qIdx >= quizDeck.length){
    document.getElementById('quizView').style.display = 'none';
    document.getElementById('doneView').style.display = 'block';
    document.getElementById('finalScore').textContent = `${score} / ${quizDeck.length} doğru cevap`;
    return;
  }
  document.getElementById('quizView').style.display = 'block';
  document.getElementById('doneView').style.display = 'none';
  answered = false;
  const v = quizDeck[qIdx];
  document.getElementById('quizWord').textContent = v.de;
  document.getElementById('quizPos').textContent = v.pos;
  document.getElementById('quizCount').textContent = `Soru ${qIdx+1} / ${quizDeck.length}`;
  document.getElementById('quizBar').style.width = `${((qIdx+1)/quizDeck.length)*100}%`;
  document.getElementById('scorePill').textContent = `${score} doğru`;

  let opts = [v.tr];
  const pool = vocab.filter(x => x.tr !== v.tr);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  opts = opts.concat(pool.slice(0,3).map(x => x.tr));
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = o;
    b.onclick = () => selectAnswer(o, v.tr, b);
    optionsEl.appendChild(b);
  });
}

function selectAnswer(chosen, correct, btnEl){
  if(answered) return;
  answered = true;
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b => {
    b.disabled = true;
    if(b.textContent === correct) b.classList.add('correct');
    else if(b === btnEl) b.classList.add('wrong');
  });
  if(chosen === correct) score++;
  document.getElementById('scorePill').textContent = `${score} doğru`;
  setTimeout(() => { qIdx++; renderQuiz(); }, 700);
}

document.getElementById('restartBtn').onclick = buildQuizDeck;

// ---- Tabs ----
document.getElementById('tabCards').onclick = () => {
  document.getElementById('tabCards').classList.add('active');
  document.getElementById('tabQuiz').classList.remove('active');
  document.getElementById('cardsView').style.display = 'block';
  document.getElementById('quizView').style.display = 'none';
  document.getElementById('doneView').style.display = 'none';
};
document.getElementById('tabQuiz').onclick = () => {
  document.getElementById('tabQuiz').classList.add('active');
  document.getElementById('tabCards').classList.remove('active');
  document.getElementById('cardsView').style.display = 'none';
  buildQuizDeck();
  renderQuiz();
};

renderCard();
</script>
