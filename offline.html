<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<title>Çevrimdışısın · Dil Kartları</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 50% 12%, rgba(79,232,255,.16), transparent 58%),
      radial-gradient(circle at 80% 90%, rgba(155,123,255,.14), transparent 55%),
      linear-gradient(180deg,#050710,#04050a 55%,#030308);
    color:#eef4ff;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .box{max-width:360px;}
  img{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.5);}
  h1{font-size:22px;margin:22px 0 8px;letter-spacing:.01em;}
  p{color:#8291b3;font-size:14px;line-height:1.6;margin:0 0 26px;}
  button{
    font:inherit;font-weight:700;font-size:14px;
    padding:13px 26px;border-radius:999px;cursor:pointer;
    color:#04050a;border:0;
    background:linear-gradient(120deg,#4fe8ff,#9b7bff);
    box-shadow:0 8px 24px rgba(79,232,255,.25);
  }
  .dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#ff5f7a;margin-right:7px;vertical-align:1px;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}
  small{display:block;margin-top:18px;color:#5d6b8c;font-size:12px;}
</style>
</head>
<body>
  <div class="box">
    <img src="icon-192.png" alt="Dil Kartları">
    <h1><span class="dot"></span>Bağlantı yok</h1>
    <p>İnternet bağlantın kesildi. Daha önce açtığın kartlar cihazında saklı —
       uygulamayı yeniden açtığında çevrimdışı çalışmaya devam edebilirsin.</p>
    <button onclick="location.replace('./')">Yeniden dene</button>
    <small>Lumira · Dil Kartları</small>
  </div>
<script>
  addEventListener('online', () => location.replace('./'));
  setInterval(() => { if (navigator.onLine) location.replace('./'); }, 4000);
</script>
</body>
</html>
